version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      go-modules:
        patterns: ["*"]
    ignore:
      # gets no more releases, newer versions moved to
      # github.com/alecthomas/kingpin/v2 which changes the help output
      - dependency-name: gopkg.in/alecthomas/kingpin.v2
