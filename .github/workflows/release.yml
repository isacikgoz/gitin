name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # publish the release
      id-token: write # sign the attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: false # a release must not use a cache other runs could have written
      # named gitin_<tag>_<os>_<arch>.tar.gz like earlier releases, the Homebrew tap downloads them
      - name: Build the release archives
        run: make dist VERSION="$GITHUB_REF_NAME"
      - name: Test the release binary
        run: |
          binary="$PWD/build/linux_$(go env GOARCH)/gitin"
          "$binary" --version 2>&1 | grep -Fx "gitin version $GITHUB_REF_NAME"
          GITIN_E2E_BINARY="$binary" go test ./e2e/
      # verify with: gh attestation verify <archive> --repo isacikgoz/gitin
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      # a maintainer reviews the notes and publishes the draft
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--draft --generate-notes --verify-tag --repo "$GITHUB_REPOSITORY")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt "${flags[@]}"
